# Checks the site, then publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every referenced file exists (exact case)
        run: python3 tools/check_assets.py

      - name: JavaScript parses
        run: for f in js/*.js js/world/*.js; do node --check "$f"; done

      # the site is plain files: copy only what visitors need (no tools, source photos or notes)
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml .nojekyll css js _site/
          rsync -a --exclude photos/ assets/ _site/assets/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
